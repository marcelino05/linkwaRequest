<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  
  <title>LinkWA MG - API Tester</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
  <div class="app">
    
    <aside class="sidebar">
      
      <h3>Requests</h3>
      
      <button onclick="novaRequest()">+ Nova</button>
      
      <ul id="history"></ul>
      
    </aside>
    <main class="workspace">
      <h2 style="text-align: center;">LinkWa_mg test Request </h2>
      
      <section class="request">
        
        <div class="topbar">
          
          <select id="method">
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>PATCH</option>
            <option>DELETE</option>
          </select>
          
          <input id="url" placeholder="https://api.exemplo.com">
          
          <button onclick="sendRequest()">Enviar</button>
          
        </div>
        
        <textarea id="body" placeholder='{"nome":"MG"}'></textarea>
        
        <textarea id="headers" placeholder='{"Authorization":"Bearer token"}'></textarea>
        
      </section>
      
      <section class="response">
        
        <div class="response-info">
          <span id="status"></span>
          <span id="time"></span>
        </div>
        
        <pre id="response">Resposta aparecerá aqui...</pre>
        
      </section>
      
    </main>
    
  </div>
  
  
  <script src="app.js">
    
  </script>
  
</body>

</html>
